
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Tester 3000 V7</title>
<style>
body {
  background: #080c1c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
}
h1 { color: #00f5ff; }
.panel {
  background: #17203a;
  padding: 20px;
  border-radius: 16px;
  margin: 15px auto;
  max-width: 650px;
}
#status { color: orange; }
#buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.button {
  background: #303a55;
  border: 2px solid #667;
  padding: 16px 4px;
  border-radius: 10px;
}
.active {
  background: #00ff99;
  color: black;
  box-shadow: 0 0 22px #00ff99;
}
.axis { margin: 12px; }
meter { width: 85%; }
#last { color: #00f5ff; font-size: 22px; }
</style>
</head>
<body>

<h1>⚡ ULTIMATE TESTER 3000 ⚡</h1>
<h2>VERSION 7</h2>

<div class="panel">
<h2 id="status">Waiting for controller...</h2>
<p>Connect your Bluetooth controller, then press a button.</p>
<button onclick="start()">START TESTER</button>
</div>

<div class="panel">
<h2>🎮 BUTTON TEST</h2>
<div id="buttons"></div>
</div>

<div class="panel">
<h2>🕹️ JOYSTICK AXES</h2>
<div id="axes"></div>
</div>

<div class="panel">
<h2>LAST BUTTON PRESSED</h2>
<div id="last">None yet</div>
</div>

<script>
const buttons = document.getElementById("buttons");
const axes = document.getElementById("axes");
const statusText = document.getElementById("status");
const last = document.getElementById("last");

for (let i = 0; i < 32; i++) {
  const b = document.createElement("div");
  b.className = "button";
  b.id = "btn" + i;
  b.textContent = "Button " + i;
  buttons.appendChild(b);
}

function start() {
  statusText.textContent = "Looking for controller...";
  requestAnimationFrame(update);
}

function update() {
  const pads = navigator.getGamepads
    ? navigator.getGamepads() : [];

  const pad = Array.from(pads).find(p => p);

  if (pad) {
    statusText.textContent = "✅ CONTROLLER CONNECTED";
    statusText.style.color = "#00ff99";

    for (let i = 0; i < 32; i++) {
      const element = document.getElementById("btn" + i);
      const pressed = pad.buttons[i]?.pressed || false;
      element.classList.toggle("active", pressed);
      if (pressed) last.textContent = "BUTTON " + i;
    }

    axes.innerHTML = "";
    pad.axes.forEach((value, i) => {
      const div = document.createElement("div");
      div.className = "axis";
      div.textContent = "Axis " + i + ": " + value.toFixed(3);
      const meter = document.createElement("meter");
      meter.min = -1;
      meter.max = 1;
      meter.value = value;
      div.appendChild(meter);
      axes.appendChild(div);
    });
  } else {
    statusText.textContent = "Waiting for controller...";
    statusText.style.color = "orange";
  }

  requestAnimationFrame(update);
}
</script>
</body>
</html>
